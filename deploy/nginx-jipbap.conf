# jipbap — nginx, not Caddy.
#
# This box already runs nginx with certbot for <other-site>, and one web
# server is one place to look when something is wrong. Two of them competing for
# 80/443 is how a live site goes down at 3am.
#
# The wedding site is a NAME-based vhost, so it keeps working untouched: nginx
# routes by Host header, and only requests whose Host matches nothing land here.
#
# Install:  sudo ln -s ../sites-available/jipbap /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

server {
    # The default for port 80: anything whose Host does not match another block,
    # which today means a bare-IP request. `_` is a name that cannot match a real
    # Host header, so this block is only ever reached by being the default.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Certbot's HTTP-01 challenge, left open for the day jipbap.com is bought.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    # ── the curation queue is not public ──────────────────────────────────
    #
    # `/curate` is the internal review tool. It is force-dynamic, it WRITES to
    # data/curation/, and until now the only thing between it and the internet
    # was nobody guessing the URL. Locked here rather than in the app so a route
    # the app adds later and forgets to guard cannot bypass it.
    location /curate {
        auth_basic           "jipbap curation";
        auth_basic_user_file /etc/nginx/.htpasswd-curate;
        proxy_pass           http://127.0.0.1:3000;
        proxy_http_version   1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── traffic stats, from the logs we already keep ──────────────────────
    #
    # GoAccess reads `jipbap.access.log` and writes a static HTML file; nothing
    # is served from the app and no script runs in anyone's browser. That is the
    # whole reason it was chosen: no third party, no cookie banner, and nothing
    # to add to the privacy policy, because it reports on logs the policy
    # already discloses.
    #
    # Behind basic auth on its own credential file, separate from /curate: two
    # different jobs should not share one password.
    location /_stats {
        auth_basic           "jipbap stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        alias                /var/www/jipbap-stats;
        index                index.html;
        # Regenerated on a timer, so never let a proxy or browser pin an old one.
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Server actions and RSC streaming want these; without them a slow
        # action can be cut off mid-flight.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # The privacy policy says 14 days; logrotate on this box is what keeps it
    # (daily, rotate 14). If you change one, change the other.
    access_log /var/log/nginx/jipbap.access.log;
    error_log  /var/log/nginx/jipbap.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
