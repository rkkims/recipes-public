# jipbap, once the domain exists. NOT enabled yet.
#
# `nginx-jipbap.conf` is what is live today: the default server on port 80, so a
# bare-IP request reaches the app. This file is the same thing addressed by name,
# and it is what replaces it the day `jipbap.com` resolves.
#
# `jipbap.com` is canonical and `jipbap.app` redirects to it — the TLD decision
# of 2026-08-12. Both are in the certificate list below on purpose: a redirect
# served over https needs a valid certificate for the name being redirected
# FROM, or the browser refuses the connection before it can ever see the 301.
#
#   1. point an A record at <server-ip> for each name, and wait for
#      `dig +short jipbap.com`
#   2. sudo cp deploy/nginx-jipbap-domain.conf /etc/nginx/sites-available/jipbap
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d jipbap.com -d www.jipbap.com \
#                          -d jipbap.app -d www.jipbap.app
#      certbot rewrites this file with the certificate lines and reloads.
#      Drop the `.app` pair from this command until that domain is registered —
#      certbot fails the whole order if any one name does not resolve.
#   4. delete INSECURE_COOKIES from app/.env.production, then ./deploy/deploy.sh
#
# Step 4 is not optional and not cosmetic: the session cookie is running without
# `secure` because a secure cookie over plain http is silently dropped by the
# browser and sign-in would do nothing. The moment there is TLS, that flag has to
# go, or session tokens keep travelling in the clear.
#
# The wedding site is a name-based vhost and is untouched by any of this. nginx
# routes by Host header; two sites on one pair of ports is what `server_name` is
# for, and neither needs to move.

server {
    listen 80;
    listen [::]:80;
    # Every name we answer for, canonical and redirected alike — this block's
    # only jobs are the ACME challenge and getting off plain http.
    server_name jipbap.com www.jipbap.com jipbap.app www.jipbap.app;

    # Left open above the redirect so renewals do not need nginx stopped.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://jipbap.com$request_uri; }
}

# ── everything that is not the canonical name, over TLS ───────────────────
#
# `www` and both `.app` names land here and leave with a 301. Separate from the
# block below rather than folded into it: one `server_name` serving four names
# would make all four canonical, which is the thing `alternates.canonical` in
# the app is trying to prevent.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jipbap.com jipbap.app www.jipbap.app;

    # Same certificate as below — certbot issues one covering every -d name.

    location / { return 301 https://jipbap.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jipbap.com;

    # certbot fills these in on first issue:
    #   ssl_certificate     /etc/letsencrypt/live/jipbap.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/jipbap.com/privkey.pem;
    #   include             /etc/letsencrypt/options-ssl-nginx.conf;
    #   ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── the curation queue is not public ──────────────────────────────────
    #
    # `/curate` writes to data/curation/ and is force-dynamic. Locked in the
    # proxy rather than in the app, so a route the app adds later and forgets to
    # guard cannot bypass it.
    location /curate {
        auth_basic           "jipbap curation";
        auth_basic_user_file /etc/nginx/.htpasswd-curate;
        proxy_pass           http://127.0.0.1:3000;
        proxy_http_version   1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GoAccess, behind its own credential file — two different jobs should not
    # share one password. This block was LOST in the first domain cutover
    # (2026-08-21): it lived only in `nginx-jipbap.conf` and the copy replaced
    # the whole file, so the stats page 308'd into the app until a runbook
    # re-read caught it. If a location exists in the IP-era config, it must
    # exist here, or the cutover deletes it silently.
    location /_stats {
        auth_basic           "jipbap stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        alias                /var/www/jipbap-stats;
        index                index.html;
        # Regenerated on a timer, so never let a proxy or browser pin an old one.
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/jipbap.access.log;
    error_log  /var/log/nginx/jipbap.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
