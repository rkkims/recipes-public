# The catch-all for :443 — belongs to no site, which is the point.
#
# Install:  sudo cp deploy/nginx-default-tls.conf /etc/nginx/sites-available/default-tls
#           sudo ln -s ../sites-available/default-tls /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# ── What went wrong without it ────────────────────────────────────────────
#
# `nginx-jipbap.conf` claims `default_server` on port 80, so a request with an
# unrecognised Host — a bare-IP request — reaches jipbap. Nothing claimed it on
# port 443, and nginx's fallback when no block is marked is the FIRST block for
# that port. That was the wedding site. So:
#
#     http://<server-ip>/    →  jipbap
#     https://<server-ip>/   →  <other-site>'s invitation
#
# Two different sites on ONE hostname, separated only by scheme. Browsers cache
# a favicon against the host, and the invitation deliberately serves none of its
# own (`location = /favicon.ico { return 404; }`, "no favicon by design"), so
# the empty slot got filled with jipbap's mark. That is how it was noticed, and
# it is the least of it.
#
# The real cost is on launch day. The A record for `jipbap.com` lands before
# certbot has issued anything, and in that window every `https://jipbap.com`
# request would have been answered — with a certificate for <other-site>
# and a wedding invitation behind it. A stranger's first visit to the product,
# and a private invitation served to whoever typed the wrong name.
#
# ── Why 444 and not a redirect ────────────────────────────────────────────
#
# A request whose Host we do not answer for is not a request to be helped. It is
# a scanner, a stale DNS entry, or somebody else's domain pointed here — and the
# useful answer to all three is nothing at all. `444` is nginx's own code for
# closing the connection without a response.
#
# The certificate lines are mandatory: nginx cannot complete a TLS handshake
# without one, and there is no handshake-free way to say "wrong host". The
# wedding certificate is borrowed to satisfy that, and the mismatch a client
# sees is CORRECT — they asked for a name this server does not serve. Nothing
# is decrypted and nothing is served, so borrowing it discloses nothing.
#
# `ssl_reject_handshake on;` says the same thing more precisely and needs no
# certificate at all — the handshake itself is refused, so a bare-IP visitor
# is never shown the wedding certificate. Adopted 2026-08-19 (box now runs
# nginx 1.24): the borrowed-certificate era briefly put <other-site>'s
# name in front of anyone who typed https://<ip>, and a cached jipbap favicon
# beside a wedding certificate reads as one site leaking into the other.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # `_` cannot match a real Host header, so this block is only ever reached by
    # being the default — the same trick `nginx-jipbap.conf` uses on port 80.
    server_name _;

    ssl_reject_handshake on;
}
